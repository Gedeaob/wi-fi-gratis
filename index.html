<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Grátis - Acesso Livre</title>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            overscroll-behavior: none;
            width: 100%; height: 100%;
            position: fixed; /* Impede rolagem e bounce no mobile */
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* FLASH EFFECT */
        .flash-effect {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 300; opacity: 0; pointer-events: none;
        }
        .flash-active { animation: flash-bang 0.4s ease-out; }
        @keyframes flash-bang { 0% { opacity: 0.9; } 100% { opacity: 0; } }

        /* TELA PRINCIPAL (GORILA) */
        #troll-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; background: #000;
        }

        .gorilla-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('imagem/gorila.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 1;
        }

        .troll-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; /* 👈 Alinha ao topo */
            padding-top: 40vh;           /* 👈 Ajuste aqui para posicionar na testa */
            pointer-events: none;
        }

        .troll-text {
            color: #ffffff; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 0 30px rgba(255,0,0,0.8);
            opacity: 0; transform: scale(0.3);
            animation: troll-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
            text-align: center; line-height: 1.1; -webkit-text-stroke: 2px #ff0000;
        }

        .troll-subtext {
            color: #ffdd00; font-size: 1.3rem; font-weight: 700; margin-top: 15px;
            opacity: 0; animation: fade-in-up 0.5s ease 1.2s forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); text-align: center; padding: 0 10px;
        }

        @keyframes troll-pop {
            0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
            60% { transform: scale(1.2) rotate(3deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* SHAKE NA TELA */
        .shake-hard { animation: shake 0.15s ease-in-out 12; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-12px) rotate(-1deg); }
            20% { transform: translateX(12px) rotate(1deg); }
            30% { transform: translateX(-10px) rotate(-0.5deg); }
            40% { transform: translateX(10px) rotate(0.5deg); }
            50% { transform: translateX(-8px) rotate(-1deg); }
            60% { transform: translateX(8px) rotate(1deg); }
            70% { transform: translateX(-6px) rotate(-0.5deg); }
            80% { transform: translateX(6px) rotate(0.5deg); }
            90% { transform: translateX(-3px) rotate(-0.3deg); }
        }

        /* BARRA FAKE NO RODAPÉ */
        .fake-bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.6); color: #aaa; font-size: 0.65rem;
            text-align: center; padding: 6px; z-index: 3; backdrop-filter: blur(5px);
        }

        /* CONFETTI */
        .confetti-piece { position: fixed; z-index: 250; pointer-events: none; }

        /* RESPONSIVIDADE */
        @media (max-width: 360px) { .troll-text { font-size: 2.5rem; } .troll-subtext { font-size: 1rem; } }
        @media (min-width: 768px) { .troll-text { font-size: 4.5rem; } .troll-subtext { font-size: 1.6rem; } }
        @media (orientation: landscape) { 
            .troll-text { font-size: 3rem; } .troll-subtext { font-size: 1.1rem; } 
            .gorilla-bg { background-position: center; } 
        }
    </style>
</head>
<body>
    <div class="flash-effect" id="flash"></div>

    <div id="troll-screen">
        <div class="gorilla-bg"></div>
        <div class="troll-overlay">
            <div class="troll-text">TROUXA!</div>
        </div>
        <div class="fake-bottom-bar">Recarregue a página para tentar novamente 😈</div>
    </div>

    <script>
        // VIBRAÇÃO
        function vibratePhone() {
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 300, 100, 200, 100, 500]);
            }
        }

        // FLASH BRANCO
        function triggerFlash() {
            const flash = document.getElementById('flash');
            flash.classList.add('flash-active');
            setTimeout(() => flash.classList.remove('flash-active'), 500);
        }

        // CONFETTI
        function launchConfetti() {
            const colors = ['#ff0000', '#ffdd00', '#00ff00', '#00b4d8', '#ff00ff', '#ff6600', '#ffffff'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                const size = Math.random() * 10 + 5;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                document.body.appendChild(confetti);

                const duration = Math.random() * 2 + 1.5;
                const xDrift = (Math.random() - 0.5) * 200;
                const rotation = Math.random() * 720;

                confetti.animate([
                    { transform: `translateY(0) translateX(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(${window.innerHeight + 50}px) translateX(${xDrift}px) rotate(${rotation}deg)`, opacity: 0.5 }
                ], { duration: duration * 1000, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)', fill: 'forwards' });

                setTimeout(() => confetti.remove(), duration * 1000 + 100);
            }
        }

        // 🔥 DISPARA TUDO ASSIM QUE A PÁGINA CARREGA
        window.addEventListener('DOMContentLoaded', () => {
            triggerFlash();
            document.body.classList.add('shake-hard');
            setTimeout(() => document.body.classList.remove('shake-hard'), 2000);

            setTimeout(vibratePhone, 100);
            setTimeout(launchConfetti, 300);

            // Segunda rodada de efeitos para garantir o susto
            setTimeout(vibratePhone, 2000);
            setTimeout(launchConfetti, 2200);
        });

        // PREVINE ZOOM E SCROLL NO CELULAR
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', (e) => e.preventDefault());
    </script>
</body>
</html>
